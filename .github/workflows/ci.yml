# A cada push e pull request: confere os binários do MediaPipe, roda a suíte
# (que já gera as duas versões numa pasta temporária) e gera dist/ e dist-dev/
# como um desenvolvedor faria.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes-e-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verificar-vendor
      - run: npm test
      - run: npm run build
      - run: npm run build:dev
